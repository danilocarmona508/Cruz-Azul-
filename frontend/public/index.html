<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP Farmacias Cruz Azul</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['DM Sans', 'sans-serif'], mono: ['DM Mono', 'monospace'] },
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#1d4ed8', 600: '#1e40af', 700: '#1e3a8a', 800: '#1e3366', 900: '#172554' }
          },
          boxShadow: { 'card': '0 1px 3px 0 rgba(0,0,0,0.06), 0 4px 16px 0 rgba(29,78,216,0.07)' }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .bg-grid {
      background-color: #f0f4ff;
      background-image: linear-gradient(rgba(29,78,216,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(29,78,216,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .cross-mark { position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
    .cross-mark::before, .cross-mark::after { content: ''; position: absolute; background: #fff; border-radius: 2px; }
    .cross-mark::before { width: 20px; height: 6px; }
    .cross-mark::after  { width: 6px;  height: 20px; }
    input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 3px rgba(29,78,216,0.15); border-color: #1d4ed8; }
    .table-row-hover:hover { background-color: #eff6ff; transition: background 0.15s; }
  </style>
</head>

<body class="bg-grid min-h-screen text-slate-800 antialiased">
  <header class="bg-brand-700 shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="cross-mark bg-brand-500 rounded-lg shadow-md flex-shrink-0"></div>
        <div class="leading-tight">
          <p class="text-white/60 text-[10px] font-mono tracking-widest uppercase leading-none">Sistema ERP</p>
          <h1 class="text-white font-semibold text-lg tracking-tight leading-tight">Farmacias <span class="text-blue-300">Cruz Azul</span></h1>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-10 space-y-10">
    <div>
      <h2 class="text-2xl font-bold text-brand-800 tracking-tight">Panel de Administración</h2>
      <p class="text-slate-500 text-sm mt-0.5">Gestiona el inventario de productos de la cadena.</p>
    </div>

    <section>
      <div class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden">
        <div class="flex items-center gap-3 px-7 py-5 border-b border-slate-100 bg-gradient-to-r from-brand-50 to-white">
          <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
          </div>
          <h3 class="font-semibold text-brand-800 text-base">Agregar Nuevo Producto</h3>
        </div>
        <form id="form-producto" class="px-7 py-7">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div class="flex flex-col gap-1.5">
              <label class="text-xs font-semibold text-slate-500 uppercase">Nombre del Producto</label>
              <input id="nombre" type="text" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:bg-white" />
            </div>
            <div class="flex flex-col gap-1.5">
              <label class="text-xs font-semibold text-slate-500 uppercase">Precio (CLP $)</label>
              <input id="precio" type="number" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:bg-white" />
            </div>
            <div class="sm:col-span-2 flex flex-col gap-1.5">
              <label class="text-xs font-semibold text-slate-500 uppercase">Descripción</label>
              <textarea id="descripcion" rows="2" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:bg-white"></textarea>
            </div>
            <div class="flex flex-col gap-1.5">
              <label class="text-xs font-semibold text-slate-500 uppercase">Stock (unidades)</label>
              <input id="stock" type="number" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:bg-white" />
            </div>
            <div class="sm:col-span-2 flex justify-end pt-2">
              <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold px-8 py-3 rounded-xl shadow-md transition-all">
                Guardar Producto
              </button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <section>
      <div class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden">
        <div class="flex items-center justify-between px-7 py-5 border-b border-slate-100 bg-gradient-to-r from-brand-50 to-white">
          <h3 class="font-semibold text-brand-800 text-base">Inventario de Productos</h3>
          <span id="badge-total" class="text-xs bg-brand-100 text-brand-700 px-3 py-1 rounded-full font-medium">0 productos</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-100 bg-slate-50">
                <th class="text-left px-7 py-3 text-[11px] font-semibold text-slate-400 uppercase">#</th>
                <th class="text-left px-4 py-3 text-[11px] font-semibold text-slate-400 uppercase">Nombre</th>
                <th class="text-left px-4 py-3 text-[11px] font-semibold text-slate-400 uppercase">Descripción</th>
                <th class="text-right px-4 py-3 text-[11px] font-semibold text-slate-400 uppercase">Precio</th>
                <th class="text-right px-4 py-3 text-[11px] font-semibold text-slate-400 uppercase">Stock</th>
                <th class="text-center px-4 py-3 text-[11px] font-semibold text-slate-400 uppercase">Estado</th>
              </tr>
            </thead>
            <tbody id="lista-productos">
              </tbody>
          </table>
          <div id="empty-state" class="flex flex-col items-center justify-center py-10 text-center px-4" style="display: none;">
            <p class="font-semibold text-slate-700 text-base">Sin productos registrados</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('form-producto');
    const listaProductos = document.getElementById('lista-productos');
    const emptyState = document.getElementById('empty-state');
    const badgeTotal = document.getElementById('badge-total');

    document.addEventListener('DOMContentLoaded', fetchProductos);

    // GET: Obtener productos
    async function fetchProductos() {
      try {
        const response = await fetch('/api/productos');
        const productos = await response.json();
        
        listaProductos.innerHTML = '';
        badgeTotal.textContent = `${productos.length} productos`;
        
        if (productos.length === 0) {
          emptyState.style.display = 'flex';
          return;
        }

        emptyState.style.display = 'none';

        productos.forEach(p => {
          const row = document.createElement('tr');
          row.className = 'border-b border-slate-50 table-row-hover transition-colors';
          
          const estado = p.stock > 0 
            ? '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700">Disponible</span>'
            : '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-700">Agotado</span>';

          row.innerHTML = `
            <td class="px-7 py-4 text-slate-400 font-mono text-xs">${p.id}</td>
            <td class="px-4 py-4 font-medium text-slate-800">${p.nombre}</td>
            <td class="px-4 py-4 text-slate-500 max-w-xs truncate">${p.descripcion || '-'}</td>
            <td class="px-4 py-4 text-right font-mono text-slate-700">$${p.precio}</td>
            <td class="px-4 py-4 text-right font-mono text-slate-700">${p.stock}</td>
            <td class="px-4 py-4 text-center">${estado}</td>
          `;
          listaProductos.appendChild(row);
        });
      } catch (error) {
        console.error('Error:', error);
      }
    }

    // POST: Guardar producto
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nuevoProducto = {
        nombre: document.getElementById('nombre').value,
        precio: parseFloat(document.getElementById('precio').value),
        descripcion: document.getElementById('descripcion').value,
        stock: parseInt(document.getElementById('stock').value)
      };

      try {
        const response = await fetch('/api/productos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(nuevoProducto)
        });

        if (response.ok) {
          form.reset();
          fetchProductos();
        }
      } catch (error) {
        console.error('Error al guardar:', error);
      }
    });
  </script>
</body>
</html>
